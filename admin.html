
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理者専用ページ</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="submit-view">
    <section class="submit-card">
      <p class="eyebrow">ADMIN</p>
      <h1>管理者専用ページ</h1>
      <p>ログインを確認しています…</p>
      <div id="adminPageStatus" role="status"></div>
      <hr>

<h2>コメント管理</h2>
<p>投稿されたコメントを確認できます。</p>

<div id="commentStatus" role="status">
  コメントを読み込んでいます…
</div>

<div id="adminComments"></div>
      <button id="backButton" type="button">ログイン画面に戻る</button>
    </section>
  </main>

  <script type="module">
    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
    import { SUPABASE_URL, SUPABASE_ANON_KEY } from "./config.js";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const status = document.getElementById("adminPageStatus");

    async function checkAdmin() {
      const { data: sessionData, error: sessionError } =
        await supabase.auth.getSession();

      if (sessionError || !sessionData.session) {
        status.textContent =
          "ログインしていません。管理者ログイン画面に戻ります。";
        window.location.replace("./?mode=admin");
        return;
      }

      const { data, error } = await supabase.rpc("is_admin");

      if (error || data !== true) {
        status.textContent =
          "管理者権限を確認できませんでした。";
        return;
      }

      status.textContent =
        "ログイン成功！管理者専用ページです。";
    }

    document.getElementById("backButton").addEventListener(
      "click",
      () => {
        window.location.href = "./?mode=admin";
      }
    );
    async function loadComments() {
      const list = document.getElementById("adminComments");
      const status = document.getElementById("commentStatus");

      status.textContent = "コメントを読み込んでいます…";
      list.replaceChildren();

      const { data, error } = await supabase
        .from("comments")
        .select("id, body, created_at, saved_at")
        .order("created_at", { ascending: false });

      if (error) {
        status.textContent = "コメントを読み込めませんでした。";
        console.error(error);
        return;
      }

      if (!data || data.length === 0) {
        status.textContent = "コメントはまだありません。";
        return;
      }

      status.textContent = data.length + "件のコメント";

      data.forEach((comment) => {
        const article = document.createElement("article");
        article.style.border = "1px solid #ccc";
        article.style.borderRadius = "8px";
        article.style.padding = "12px";
        article.style.margin = "12px 0";

        const body = document.createElement("p");
        body.textContent = comment.body;

        const date = document.createElement("small");
        date.textContent = new Date(
          comment.created_at
        ).toLocaleString("ja-JP");

        
        const savedLabel = document.createElement("p");
        savedLabel.textContent = comment.saved_at
          ? "保存済み"
          : "未保存";

        const saveButton = document.createElement("button");
        saveButton.textContent = comment.saved_at
          ? "保存を解除"
          : "保存する";

        saveButton.addEventListener("click", async () => {
          saveButton.disabled = true;

          const { error } = await supabase
            .from("comments")
            .update({
              saved_at: comment.saved_at
                ? null
                : new Date().toISOString()
            })
            .eq("id", comment.id);

          if (error) {
            console.error(error);
            status.textContent = "保存に失敗しました。";
            saveButton.disabled = false;
            return;
          }

          await loadComments();
        });

        const deleteButton = document.createElement("button");
        deleteButton.textContent = "削除する";

        deleteButton.addEventListener("click", async () => {
          if (!confirm("このコメントを削除してもよいですか？")) {
            return;
          }

          deleteButton.disabled = true;

          const { error } = await supabase
            .from("comments")
            .delete()
            .eq("id", comment.id);

          if (error) {
            console.error(error);
            status.textContent =
              "削除できませんでした。管理者権限を確認してください。";
            deleteButton.disabled = false;
            return;
          }

          await loadComments();
        });

        article.append(
          body,
          date,
          savedLabel,
          saveButton,
          deleteButton
        );

        list.appendChild(article);

      });
    }
       await checkAdmin();

    if (document.getElementById("adminPageStatus").textContent
        === "ログイン成功！管理者専用ページです。") {
      await loadComments();
    }
  </script>
</body>
</html>
